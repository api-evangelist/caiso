  path_versioning: false
  current: 'varies by report: version=1, version=2 and version=12 all appear in CAISO''s own current FAQ examples'
  docs: https://www.caiso.com/documents/oasis-frequently-asked-questions.pdf
  note: >-
    The context path itself moved from /mrtu-oasis (as published in the v3.04 interface
    specification) to /oasisapi, which is what CAISO's current FAQ examples use and what
    responds today.
