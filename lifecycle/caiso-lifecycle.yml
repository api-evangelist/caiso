source: >-
  CAISO API Terms of Use (https://www.caiso.com/privacy-terms-of-use#api-terms-of-use),
  Interface Specification for OASIS v3.04, OASIS FAQ, CAISO release planning page, and
  live probes on 2026-07-27
description: >-
  CAISO runs the OASIS interface as regulated market infrastructure rather than as a
  developer product, and its lifecycle communication reflects that. There is no versioned
  API path, no published deprecation policy, no Sunset or Deprecation header support, and
  no SLA or status page for the API. Change is announced through the market-participant
  channels — market notices, the release planning process, and the access-gated developer
  site — and the API Terms of Use explicitly warn that backwards-incompatible changes can
  land without notice. The one durable version signal a caller controls is the per-report
  `version` query parameter.
