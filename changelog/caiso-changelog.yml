description: >-
  CAISO keeps no developer-facing, dated API changelog. The only versioned change record
  published for the interface itself is the revision-history table inside the OASIS
  Interface Specification, whose most recent entry is version 3.04 dated 2010-12-14 — even
  though the live interface has moved on since (the context path is now /oasisapi and
  report `version` values as high as 12 appear in CAISO's own current FAQ examples). Actual
  change communication for market participants runs through the release planning process
  and market notices, which are dated but are release-level, not API-level. Both records
  are captured here.
