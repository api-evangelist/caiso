contracts:
  openapi_found: false
  asyncapi_found: false
  postman_found: false
  graphql_found: false
  note: >-
    No machine-readable API contract of any kind is published. The OASIS API is
    described only in prose PDFs, and the only schema artifacts referenced are
    the CIM XSDs named inside the 2010 interface specification. No openapi/
    directory was created because nothing real was found to put in it. Deriving
    an OpenAPI from the PDFs is enrichment work, not harvest, and was
    deliberately not done here.

verbatim_quotes:
  - source: https://www.caiso.com/systems-applications/requesting-access-certificates
    quote: >-
      All systems and applications, except Open Access Same Time Information
      System (OASIS), require a UAA to grant and remove access.
  - source: https://www.caiso.com/systems-applications/requesting-access-certificates
    quote: >-
      ISO customer certificates are chained to the CAISO issuing authority.
  - source: https://www.caiso.com/documents/oasis-frequently-asked-questions.pdf
    quote: >-
      The California ISO Developer Site https://developer.caiso.com contains the
      OASIS Interface Specification, additional API URL Examples documents, and
      our Acceptable Use Policy (AUP) information. Note: Developer Site access
      requires Users to sign up with an ISO recognized @domain email address and
      a detailed justification. (e.g. @yahoo.com, @hotmail.com, @gmail.com,
      etc. would be subject to rejection)
  - source: https://www.caiso.com/documents/oasis-frequently-asked-questions.pdf
    quote: >-
      The OASIS data retention for the majority of the reports available is the
      previous 39 months.
  - source: https://www.caiso.com/documents/oasis-frequently-asked-questions.pdf
    quote: >-
      The data provided on OASIS does not directly match the data found on
      Today's Outlook. Today's Outlook is designed to provide data in a
      summarized manner and is Telemetry based, while OASIS is Market output
      based.
  - source: https://developer.caiso.com/_login/DeveloperLogin.aspx
    quote: >-
      Welcome to the ISO's site for developers to interface with our technical
      systems and services. This site provides detailed descriptions of current
      and emerging Application Programming Interfaces (APIs), acceptable use,
      connectivity, sample code, and frequently asked questions.

