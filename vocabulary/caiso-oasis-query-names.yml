method: searched
source: >-
  Interface Specification for OASIS v3.04, sections 5 through 8
  (https://www.caiso.com/documents/oasisapispecification.pdf), plus the current OASIS FAQ
  (https://www.caiso.com/documents/oasis-frequently-asked-questions.pdf)
name: CAISO OASIS report and parameter vocabulary
description: >-
  The OASIS Download API has no path-based resource model — the controlled vocabulary IS
  the API. A caller names a report with `queryname` (or a bundle with `groupid`), a market
  or process with `market_run_id`, and a response format with `resultformat`. This file is
  the transcribed registry of those terms as CAISO publishes them, grouped by the report
  tabs used in the OASIS interface specification, with the report-specific filter
  parameters each one takes. It is a faithful transcription, not an inference: every
  queryname, groupid and filter below appears in a CAISO document. Note that the published
  specification was last revised in 2010, so it does not contain later additions such as
  SLD_REN_FCST and PRC_RTPD_LMP — those are taken from the current FAQ and are marked with
  their source.
terms:
