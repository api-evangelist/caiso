enumerations:
  market_run_id:
    description: >-
      Market or process. Valid values are report-specific; these are the values CAISO's own
      published examples use.
    values:
    - {value: DAM, meaning: Day-Ahead Market}
    - {value: RUC, meaning: Residual Unit Commitment}
    - {value: HASP, meaning: Hour-Ahead Scheduling Process}
    - {value: RTM, meaning: Real-Time Market}
    - {value: RTPD, meaning: Real-Time Pre-Dispatch (fifteen minute market)}
    - {value: RTD, meaning: Real-Time Dispatch (five minute)}
    - {value: 2DA, meaning: Two-day-ahead forecast}
    - {value: 7DA, meaning: Seven-day-ahead forecast}
    - {value: ACTUAL, meaning: Actuals}
  resultformat:
    values:
    - {value: '5', meaning: CIM XML}
    - {value: '6', meaning: CSV}
  grp_type:
    values:
    - {value: ALL, meaning: All nodes}
    - {value: ALL_APNODES, meaning: All aggregate pricing nodes}
xml_schemas:
- {file: oasisReport.xsd, category: OASIS report data}
- {file: oasisBid.xsd, category: Public bids}
- {file: oasiscbBid.xsd, category: Convergence bidding public bids}
- {file: oasisMaster.xsd, category: Atlas / reference data}
todays_outlook_feeds:
  description: >-
    The separate Today's Outlook CSV vocabulary — report names for
    https://www.caiso.com/outlook/current/{report}.csv and
    https://www.caiso.com/outlook/history/{YYYYMMDD}/{report}.csv. Confirmed live
    2026-07-27; columns transcribed from the returned files.
  feeds:
  - name: fuelsource
    columns: [Time, Solar, Wind, Geothermal, Biomass, Biogas, Small hydro, Coal, Nuclear, Natural Gas, Large Hydro, Batteries, Imports, Other]
  - name: demand
    columns: [Time, Day ahead forecast, Hour ahead forecast, Current demand, Demand response]
  - name: netdemand
    columns: [Time, Hour ahead forecast, Current demand, Net demand, Net demand forecast, Demand response]
  - name: co2
    columns: [Time, Biogas CO2, Biomass CO2, Natural Gas CO2, Coal CO2, Imports CO2, Geothermal CO2]
glossary: https://www.caiso.com/glossary
