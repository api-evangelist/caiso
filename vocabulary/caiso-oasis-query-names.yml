  - name: PRC_LMP
    title: Locational Marginal Prices
    detail: Hourly LMP with congestion, loss and energy components for all PNodes and APNodes, $/MWh.
    filters: [market_run_id, node, grp_type]
    source: spec-v3.04
  - name: PRC_INTVL_LMP
