method: searched
source: live probes of the CAISO corporate, OASIS API and developer-site hosts
description: >-
  CAISO publishes no /.well-known/ discovery surface anywhere in its public estate. Every
  RFC 9116 security.txt, RFC 8414 oauth-authorization-server, OIDC openid-configuration,
  RFC 9727 api-catalog and ai-plugin.json probe returned 404 on www.caiso.com and
  oasis.caiso.com. developer.caiso.com is a SharePoint site that answers every unknown
  path with an HTTP 200 (or 500) SharePoint error page rather than a 404, so its responses
  are recorded with that caveat and are not treated as discovery documents. There is no
  OAuth or OpenID Connect anywhere in the public CAISO API surface — the OASIS Download
  API and the Today's Outlook feeds are anonymous, and the participant systems use PKI
  client certificates issued through a company User Access Administrator — so the absence
  of an authorization-server document is expected rather than a gap.
