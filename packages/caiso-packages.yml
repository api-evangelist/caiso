description: >-
  CAISO publishes no client libraries in any language. There is no first-party SDK, no CLI,
  and no CAISO-owned source repository for API tooling — the "CAISO" GitHub organization
  that exists (github.com/CAISO) has one public repository, a fork of the Craft CMS
  composer starter, with no members listed and nothing connecting it to the OASIS API, so
  it is not recorded as a first-party developer surface. Every client library that exists
  for OASIS is community-built. They are listed here because they are how most consumers
  actually reach this API, but none is official and none is endorsed by CAISO.
