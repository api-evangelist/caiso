apis:
- aid: caiso:caiso-oasis-download-api
  name: CAISO OASIS Download API
  description: >-
    The Open Access Same-time Information System (OASIS) Download API — CAISO's
    public wholesale market data interface. Two servlets, SingleZip and GroupZip,
    accept a queryname or groupid plus a UTC datetime range and return a ZIP
    containing CIM-format XML (resultformat=5) or CSV (resultformat=6). Report
    families cover locational marginal prices (PRC_LMP, PRC_INTVL_LMP,
    PRC_CURR_LMP), system load and renewables forecasts (SLD_FCST,
    SLD_REN_FCST), ancillary services, congestion revenue rights, and the ATLAS
    reference data set (ATL_PNODE and friends). Requests are anonymous — no API
    key, token, or account. Most reports retain roughly the previous 39 months
    of data and individual reports cap the date range they will return.
  humanURL: https://www.caiso.com/systems-applications/developer-portal
  baseURL: https://oasis.caiso.com/oasisapi
