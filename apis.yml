- aid: caiso:caiso-todays-outlook-data-feeds
  name: CAISO Today's Outlook Data Feeds
  description: >-
    The CSV feeds behind CAISO's public Today's Outlook dashboard. Anonymous GET
    requests to https://www.caiso.com/outlook/current/{report}.csv return the
    current operating day at five-minute resolution, and
    https://www.caiso.com/outlook/history/{YYYYMMDD}/{report}.csv returns a past
    day. Confirmed reports are fuelsource (generation by fuel including solar,
    wind, batteries and imports), demand, netdemand, and co2 (emissions by
    resource type). CAISO notes these are telemetry-based summaries and will not
    tie out to the market-based numbers in OASIS.
  humanURL: https://www.caiso.com/todays-outlook
  baseURL: https://www.caiso.com/outlook
